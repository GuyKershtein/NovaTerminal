name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, such as 0.1.0'
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish (${{ matrix.runtime }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test before publishing
        run: dotnet test --configuration Release

      # Self-contained, so a user can unzip and run without installing a runtime first. Trimming is
      # deliberately off: Avalonia resolves parts of its rendering stack reflectively, and a trimmed
      # build that starts on the build machine can still fail on someone else's.
      - name: Publish
        run: >
          dotnet publish src/NovaTerminal.App
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts/${{ matrix.runtime }}

      - name: Package
        shell: pwsh
        run: |
          $name = "NovaTerminal-${{ steps.version.outputs.value }}-${{ matrix.runtime }}.zip"
          Compress-Archive -Path artifacts/${{ matrix.runtime }}/* -DestinationPath $name
          echo "PACKAGE=$name" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaTerminal-${{ matrix.runtime }}
          path: ${{ env.PACKAGE }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE }}
          generate_release_notes: true
